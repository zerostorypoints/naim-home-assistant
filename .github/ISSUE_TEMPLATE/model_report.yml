name: Works with my model
description: Tell us whether the integration works with your Naim streamer
labels: [compatibility]
body:
  - type: input
    id: model
    attributes:
      label: Model and firmware
      placeholder: Mu-so 2nd generation, 3.13.0.5828
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: Discovery
        - label: Power on / standby
        - label: Volume and mute
        - label: Input selection
        - label: Playback and now playing
        - label: Stream format sensors
  - type: textarea
    id: notes
    attributes:
      label: Notes
